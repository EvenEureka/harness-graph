name: g-p0-fr-t1-vf-kres3-c0-snon
description: reproduce the bug first; checker available to the agent; review segment
  on a compacted conversation; enforced check, on failure diagnose, restore the repository
  and restart (up to 3 times)
entry: reproduce
nodes:
  fix:
    type: agent
    params:
      role: fix
      checker: true
    max_visits: 4
  reproduce:
    type: agent
    params:
      role: reproduce
      max_steps: 15
  check:
    type: check
    max_visits: 4
  reflect:
    type: reflect
    max_visits: 3
  reset:
    type: reset
    max_visits: 3
  verify:
    type: agent
    params:
      role: verify
    max_visits: 4
  verify_compact:
    type: compact
    max_visits: 4
edges:
- - fix
  - verify_compact
  - done
- - reproduce
  - fix
- - check
  - END
  - pass
- - check
  - reflect
  - fail
- - reflect
  - reset
- - reset
  - fix
- - verify
  - check
- - verify_compact
  - verify
