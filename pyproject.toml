[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-graph"
version = "0.2.0"
description = "Coding-agent harnesses as outcome-typed control-flow graphs, run on SWE-smith tasks in containers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyyaml", "openai>=1.40", "numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["harness_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
