name: g-p0-fn-t0-vn-kcon2-c32-snud
description: 'enforced check, on failure continue with the feedback (up to 2 times);
  compact the conversation above 32000 prompt tokens; no edit after 20 steps: nudge'
entry: solve
nodes:
  solve:
    type: agent
    params:
      compact_at: 32000
      edit_by: 20
    max_visits: 11
  check:
    type: check
    max_visits: 3
  compact:
    type: compact
    max_visits: 7
edges:
- - solve
  - check
  - done
- - solve
  - compact
  - context_high
- - solve
  - solve
  - stalled
- - check
  - END
  - pass
- - check
  - solve
  - fail
- - compact
  - solve
