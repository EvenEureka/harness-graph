name: g-p0-fn-t1-vn-kcon2-c0-snud
description: 'checker available to the agent; enforced check, on failure continue
  with the feedback (up to 2 times); no edit after 20 steps: nudge'
entry: solve
nodes:
  solve:
    type: agent
    params:
      checker: true
      edit_by: 20
    max_visits: 4
  check:
    type: check
    max_visits: 3
edges:
- - solve
  - check
  - done
- - solve
  - solve
  - stalled
- - check
  - END
  - pass
- - check
  - solve
  - fail
