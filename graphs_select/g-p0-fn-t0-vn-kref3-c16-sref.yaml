name: g-p0-fn-t0-vn-kref3-c16-sref
description: 'enforced check, on failure diagnose, then continue (up to 3 times);
  compact the conversation above 16000 prompt tokens; no edit after 20 steps: reflect'
entry: solve
nodes:
  solve:
    type: agent
    params:
      compact_at: 16000
      edit_by: 20
    max_visits: 12
  check:
    type: check
    max_visits: 4
  reflect:
    type: reflect
    max_visits: 3
  compact:
    type: compact
    max_visits: 7
  stall_reflect:
    type: reflect
edges:
- - solve
  - check
  - done
- - solve
  - compact
  - context_high
- - solve
  - stall_reflect
  - stalled
- - check
  - END
  - pass
- - check
  - reflect
  - fail
- - reflect
  - solve
- - compact
  - solve
- - stall_reflect
  - solve
