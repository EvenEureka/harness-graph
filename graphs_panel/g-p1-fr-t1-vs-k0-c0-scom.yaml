name: g-p1-fr-t1-vs-k0-c0-scom
description: 'plan first; reproduce the bug first; checker available to the agent;
  review segment; no edit after 20 steps: compact'
entry: plan
nodes:
  fix:
    type: agent
    params:
      role: fix
      checker: true
      edit_by: 20
    max_visits: 2
  reproduce:
    type: agent
    params:
      role: reproduce
      max_steps: 15
  plan:
    type: plan
  verify:
    type: agent
    params:
      role: verify
  stall_compact:
    type: compact
edges:
- - fix
  - verify
  - done
- - fix
  - stall_compact
  - stalled
- - reproduce
  - fix
- - plan
  - reproduce
- - verify
  - END
- - stall_compact
  - fix
