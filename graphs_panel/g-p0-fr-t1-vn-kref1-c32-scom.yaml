name: g-p0-fr-t1-vn-kref1-c32-scom
description: 'reproduce the bug first; checker available to the agent; enforced check,
  on failure diagnose, then continue (up to 1 times); compact the conversation above
  32000 prompt tokens; no edit after 20 steps: compact'
entry: reproduce
nodes:
  fix:
    type: agent
    params:
      role: fix
      checker: true
      compact_at: 32000
      edit_by: 20
    max_visits: 10
  reproduce:
    type: agent
    params:
      role: reproduce
      max_steps: 15
  check:
    type: check
    max_visits: 2
  reflect:
    type: reflect
  compact:
    type: compact
    max_visits: 7
  stall_compact:
    type: compact
edges:
- - fix
  - check
  - done
- - fix
  - compact
  - context_high
- - fix
  - stall_compact
  - stalled
- - reproduce
  - fix
- - check
  - END
  - pass
- - check
  - reflect
  - fail
- - reflect
  - fix
- - compact
  - fix
- - stall_compact
  - fix
