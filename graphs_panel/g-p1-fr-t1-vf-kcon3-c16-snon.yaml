name: g-p1-fr-t1-vf-kcon3-c16-snon
description: plan first; reproduce the bug first; checker available to the agent;
  review segment on a compacted conversation; enforced check, on failure continue
  with the feedback (up to 3 times); compact the conversation above 16000 prompt tokens
entry: plan
nodes:
  fix:
    type: agent
    params:
      role: fix
      checker: true
      compact_at: 16000
    max_visits: 11
  reproduce:
    type: agent
    params:
      role: reproduce
      max_steps: 15
  plan:
    type: plan
  check:
    type: check
    max_visits: 4
  verify:
    type: agent
    params:
      role: verify
    max_visits: 4
  verify_compact:
    type: compact
    max_visits: 4
  compact:
    type: compact
    max_visits: 7
edges:
- - fix
  - verify_compact
  - done
- - fix
  - compact
  - context_high
- - reproduce
  - fix
- - plan
  - reproduce
- - check
  - END
  - pass
- - check
  - fix
  - fail
- - verify
  - check
- - verify_compact
  - verify
- - compact
  - fix
