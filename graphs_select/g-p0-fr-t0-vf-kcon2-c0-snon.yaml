name: g-p0-fr-t0-vf-kcon2-c0-snon
description: reproduce the bug first; review segment on a compacted conversation;
  enforced check, on failure continue with the feedback (up to 2 times)
entry: reproduce
nodes:
  fix:
    type: agent
    params:
      role: fix
    max_visits: 3
  reproduce:
    type: agent
    params:
      role: reproduce
      max_steps: 15
  check:
    type: check
    max_visits: 3
  verify:
    type: agent
    params:
      role: verify
    max_visits: 3
  verify_compact:
    type: compact
    max_visits: 3
edges:
- - fix
  - verify_compact
  - done
- - reproduce
  - fix
- - check
  - END
  - pass
- - check
  - fix
  - fail
- - verify
  - check
- - verify_compact
  - verify
